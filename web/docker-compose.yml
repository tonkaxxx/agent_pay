services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      target: builder
    command:
      - node
      - web/node_modules/next/dist/bin/next
      - dev
      - web
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      REDIS_URL: redis://redis:6379
      AGENT_PRIVATE_KEY: ""
      BASE_MAINNET_RPC_URL: ""
      ALLOW_MAINNET_PAYMENTS: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4.7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
