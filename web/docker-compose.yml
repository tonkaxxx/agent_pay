name: agentpay

services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        AGENTPAY_RELEASE: local
        NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000/
    image: agentpay:local
    command: ["node", "/app/web/server.js"]
    environment:
      NODE_ENV: production
      AGENTPAY_ALLOW_INSECURE_LOCAL_ORIGIN: "true"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000/
      AGENTPAY_PAY_TO: 0x58B0fF9Fd53C854f3779acdE649a7FAc2de2d1CB
      FACILITATOR_URL: http://facilitator:4022
      REDIS_URL: redis://:local-agentpay-only@redis:6379/0
      DATABASE_URL: postgres://agentpay:local-agentpay-only@postgres:5432/agentpay
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      facilitator:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [backend, public]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/basic').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  facilitator:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        AGENTPAY_RELEASE: local
        NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000/
    image: agentpay:local
    command: ["node", "/app/facilitator/dist/index.js"]
    environment:
      HOST: 0.0.0.0
      PORT: "4022"
      FACILITATOR_NETWORK: eip155:8453
      BASE_MAINNET_RPC_URL: ${BASE_MAINNET_RPC_URL:?set a Base Mainnet RPC URL}
      FACILITATOR_PRIVATE_KEY: ${FACILITATOR_PRIVATE_KEY:?set a dedicated gas-only facilitator key}
    networks:
      backend:
      egress:
        gw_priority: 1
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4022/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  redis:
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    user: "999:1000"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "local-agentpay-only"]
    networks: [backend]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "local-agentpay-only", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - agentpay-redis-local:/data

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    user: "70:70"
    environment:
      POSTGRES_USER: agentpay
      POSTGRES_PASSWORD: local-agentpay-only
      POSTGRES_DB: agentpay
    networks: [backend]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run/postgresql:rw,noexec,nosuid,size=4m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpay -d agentpay"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - agentpay-postgres-local:/var/lib/postgresql/data

  migrate:
    image: agentpay:local
    command: ["node", "/app/web/scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://agentpay:local-agentpay-only@postgres:5432/agentpay
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    restart: "no"

networks:
  backend:
    internal: true
  egress:
  public:

volumes:
  agentpay-redis-local:
  agentpay-postgres-local:
